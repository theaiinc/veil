# Local Presidio stack for @theaiinc/veil-presidio.
# Analyzer detects PII; Anonymizer performs native anonymization.
#   docker compose up -d
# Analyzer:   http://localhost:5002
# Anonymizer: http://localhost:5001
services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5002:3000"
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5001:3000"
    restart: unless-stopped
